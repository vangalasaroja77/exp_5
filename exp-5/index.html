<!DOCTYPE html>
<html>
<head>
    <title>Event Registration</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h2>Event Registration</h2>

    <form id="form">
        <input id="name" placeholder="Full Name" required><br>
        <input id="email" type="email" placeholder="Email" required><br>
        <input id="phone" placeholder="Phone Number" required><br>

        Gender:
        <input type="radio" name="gender" value="Male" required> Male
        <input type="radio" name="gender" value="Female"> Female<br>

        <input id="college" placeholder="College Name" required><br>

        <select id="dept" required>
            <option value="">Department</option>
            <option>CSE</option>
            <option>ECE</option>
            <option>IT</option>
        </select><br>

        <select id="year" required>
            <option value="">Year</option>
            <option>1st Year</option>
            <option>2nd Year</option>
            <option>3rd Year</option>
            <option>4th Year</option>
        </select><br>

        <select id="event" required>
            <option value="">Select Event</option>
            <option>Hackathon</option>
            <option>Workshop</option>
            <option>Quiz</option>
        </select><br>

        <button type="submit">Register</button>
        <button type="reset">Reset</button>
    </form>

    <p id="error"></p>
    <div id="result"></div>

    <script src="script.js"></script>
</body>
</html>
